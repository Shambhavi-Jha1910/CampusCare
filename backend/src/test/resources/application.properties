spring.datasource.url=jdbc:h2:mem:campuscare-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
campuscare.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
campuscare.security.csrf-cookie-secure=false
campuscare.security.csrf-cookie-same-site=Lax
