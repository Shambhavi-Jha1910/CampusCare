spring.application.name=campuscare-backend
server.port=${PORT:${SERVER_PORT:8080}}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campuscare?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=false

campuscare.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
campuscare.security.csrf-cookie-secure=false
campuscare.security.csrf-cookie-same-site=Lax

campuscare.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
campuscare.bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:CampusCare Admin}
campuscare.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
